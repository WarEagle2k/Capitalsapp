<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Molly's Capital Matching Quiz</title>
  <meta name="description" content="Match US state capitals to their states">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="match.css">
</head>
<body>
  <header>
    <span id="last-updated"></span>
    <h1>Molly's Capital Matching Quiz</h1>
    <p class="subtitle">Type the number of the matching capital for each state</p>
    <nav id="page-nav">
      <a href="index.html">Map Quiz</a>
      <a href="match.html" class="active">Matching Quiz</a>
      <a href="flash.html">Flash Cards</a>
    </nav>
  </header>

  <main id="match-main">
    <div id="match-container">
      <div id="states-column">
        <h3>States</h3>
        <ol id="states-list"></ol>
      </div>
      <div id="capitals-column">
        <h3>Capitals</h3>
        <ol id="capitals-list"></ol>
      </div>
    </div>

    <div id="match-controls">
      <button id="check-btn">Check Answers</button>
      <button id="shuffle-btn">New Shuffle</button>
      <span id="match-score" class="hidden"></span>
    </div>
  </main>

  <footer></footer>

  <script src="states-data.js"></script>
  <script src="match.js"></script>
</body>
</html>
